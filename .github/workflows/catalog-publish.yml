# Publish the plugin catalog as a signed OCI artifact.
#
# The lfed host pins this exact signing identity
# (internal/pluginmgr/catalog.go DefaultCatalogIdentity):
#   https://github.com/LF-Certification/lfed-cli/.github/workflows/catalog-publish.yml@refs/heads/main
#
# Do NOT rename this file. Do NOT rename the main branch. Either change
# breaks every `lfed plugin install` until the host is updated and released.

name: Publish catalog

on:
  push:
    branches:
      - main
    paths:
      - catalog/**
      - .github/workflows/catalog-publish.yml
  # Republish the catalog from the current main without a content change,
  # for example after a history rewrite or a signing incident.
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-catalog
  cancel-in-progress: false

env:
  CATALOG_REF: ghcr.io/lf-certification/lfed-cli-plugins/catalog
  ARTIFACT_TYPE: application/vnd.linuxfoundation.ed.cli.catalog.v1

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install devbox
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: "true"
          devbox-version: "0.18.4"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Install oras
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.0

      - name: Build and validate the catalog
        run: devbox run -- make catalog

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the catalog
        id: push
        run: |
          digest="$(oras push "${CATALOG_REF}:latest" \
            --artifact-type "${ARTIFACT_TYPE}" \
            --format json \
            "catalog/catalog.json:${ARTIFACT_TYPE}+json" | jq -r '.digest')"
          test -n "$digest" || { echo "oras push returned no digest"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "pushed ${CATALOG_REF}@${digest}"

      - name: Sign the catalog
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${CATALOG_REF}@${DIGEST}"

      - name: Verify the signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/catalog-publish.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${CATALOG_REF}@${DIGEST}"

      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io
